# frontend/nginx.conf — Reverse proxy and static file server configuration for EpiNet frontend
server {
    # WHY 8080: allows unprivileged (non-root) user execution inside the container
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # WHY 60M: accommodates up to 50 MB CSV uploads with multipart form overhead
    client_max_body_size 60M;

    # Serve compiled React SPA static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # WHY proxy_pass http://backend:8080: routes API traffic to the Spring Boot
    # container using Docker Compose internal DNS resolution without exposing backend directly to client
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
