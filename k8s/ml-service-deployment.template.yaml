# k8s/ml-service-deployment.yaml — Deployment and Service for FastAPI ML Worker (Phase 4)
# WHY: provides scalable epistasis linear regression worker consuming from Kafka
# with readiness/liveness probes and NodePort 30082 exposure. ${KIND_GATEWAY_IP} is templated at deploy time.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: epinet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      hostAliases:
      # WHY hostAliases: routes host.docker.internal to kind bridge gateway IP
      # allowing the worker to connect to compose Kafka (port 9094)
      - ip: "${KIND_GATEWAY_IP}"
        hostnames:
        - "host.docker.internal"
      containers:
      - name: ml-service
        image: epinet-ml-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: epinet-config
              key: BACKEND_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: epinet-config
              key: KAFKA_BOOTSTRAP_SERVERS
        # WHY OMP_NUM_THREADS/OPENBLAS_NUM_THREADS=1: Prevents 16-thread oversubscription against 1500m CFS quota;
        # eliminates CPU throttling (0 throttled periods vs 122) and reduces 40 MB compute time from 12.98s to 1.98s.
        - name: OMP_NUM_THREADS
          value: "1"
        - name: OPENBLAS_NUM_THREADS
          value: "1"
        resources:
          # WHY requests/limits: measured peak RSS is ~119-146 MiB under 40 MB jobs; 512Mi limit provides >2.8x headroom
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: epinet
spec:
  # WHY NodePort 30082: allows direct debugging and HTTP analysis trigger from host
  type: NodePort
  selector:
    app: ml-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30082
    name: http
