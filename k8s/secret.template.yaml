# k8s/secret.template.yaml — Template for sensitive database credentials (Phase 4)
# WHY: provides a committed, documented template without exposing real credentials.
# Run `python k8s/generate-secrets.py` to create the git-ignored `k8s/secret.yaml` from your local `.env`.

apiVersion: v1
kind: Secret
metadata:
  name: epinet-secrets
  labels:
    app.kubernetes.io/part-of: epinet
type: Opaque
stringData:
  # WHY stringData: Kubernetes automatically base64-encodes these values upon creation
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  DB_PASS: "${DB_PASS}"
