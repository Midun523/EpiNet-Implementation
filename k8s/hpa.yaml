# k8s/hpa.yaml — Horizontal Pod Autoscaler for ml-service (Phase 4)
# WHY: automatically scales ml-service replicas based on CPU utilization during computational loads.
# WHY NO BACKEND HPA: Backend is pinned to 1 replica (maxReplicas=1 was meaningless for an HPA).
# Bounding backend to 1 replica (2Gi limit) and autoscaling only ml-service (up to 3 replicas at 512Mi each)
# keeps total cluster limit at ~6.35 GiB, well within the 7.57 GiB Docker VM without memory pressure or swap.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-service-hpa
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: epinet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-service
  minReplicas: 1
  # WHY maxReplicas=3: analysis.requested topic has exactly 3 partitions; additional replicas would remain idle.
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # WHY 60%: triggers scale-out when CPU usage exceeds 60% of request (250m) during multi-pair epistasis regression
        averageUtilization: 60
