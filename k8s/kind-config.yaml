# k8s/kind-config.yaml — Reproducible local Kubernetes cluster configuration (Phase 4)
# WHY: provides a single-node kind cluster with host-port bindings for NodePort access,
# enabling seamless testing of frontend, backend, and ingress traffic from the host.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: epinet-cluster
nodes:
- role: control-plane
  extraPortMappings:
  # WHY port 30080: maps host port 30080 to frontend NodePort service
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  # WHY port 30081: maps host port 30081 to backend NodePort service
  - containerPort: 30081
    hostPort: 30081
    protocol: TCP
  # WHY port 30082: maps host port 30082 to ml-service NodePort service
  - containerPort: 30082
    hostPort: 30082
    protocol: TCP
