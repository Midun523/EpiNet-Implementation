# k8s/backend-deployment.yaml — Deployment and Service for Spring Boot backend (Phase 4)
# WHY: provides scalable relational ingestion and REST API layer with readiness/liveness probes,
# measured resource requests/limits, and NodePort 30081 exposure. ${KIND_GATEWAY_IP} is templated at deploy time.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: epinet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      hostAliases:
      # WHY hostAliases: routes host.docker.internal to the kind bridge gateway IP
      # allowing the pod to connect to compose MySQL (port 3307) and compose Kafka (port 9094)
      - ip: "${KIND_GATEWAY_IP}"
        hostnames:
        - "host.docker.internal"
      containers:
      - name: backend
        # WHY imagePullPolicy IfNotPresent: uses locally loaded container image without requiring remote registry
        image: epinet-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: epinet-config
              key: DB_URL
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: epinet-config
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: epinet-secrets
              key: DB_PASS
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: epinet-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: ML_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: epinet-config
              key: ML_SERVICE_URL
        - name: ANALYSIS_MODE
          value: "kafka"
        - name: JAVA_TOOL_OPTIONS
          # WHY MaxRAMPercentage=70.0: dynamically bounds JVM heap to 70% of container memory limit (~1430 MB of 2.0 GiB)
          # leaving ~600 MB headroom for Metaspace, thread stacks, Tomcat multipart buffers, and G1GC native memory
          value: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC"
        resources:
          # WHY requests/limits: measured empirically; 3 consecutive 40 MB uploads pushed RSS past 1.5Gi triggering OOMKilled
          # 2Gi limit provides necessary headroom for off-heap allocations without kernel termination
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
        readinessProbe:
          # WHY /actuator/health: asserts database connection and Kafka connectivity are ready before receiving traffic
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: epinet
spec:
  # WHY NodePort 30081: enables direct host-level HTTP access via kind extraPortMappings
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
    name: http
