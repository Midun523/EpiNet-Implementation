# ─── MySQL profile (default) ───────────────────────────────────────────────
spring.application.name=epinet-backend
server.port=8080
spring.profiles.default=mysql

# DB settings from env with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/epinet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:epinet}
spring.datasource.password=${DB_PASS:epinet_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ML microservice URL (override in env)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Multipart limits (supports CSVs up to 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Async executor (used by the sync analysis path)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# ─── Analysis mode ───────────────────────────────────────────────────────────
# WHY: "kafka" = event-driven async path (default), "sync" = direct @Async HTTP
# to ML service. Both paths are kept so Phase 5 can benchmark them side by side.
analysis.mode=${ANALYSIS_MODE:kafka}

# ─── Kafka ───────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: sends JSON events keyed by analysisId
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer: reads JSON events as String, parsed via ObjectMapper
spring.kafka.consumer.group-id=epinet-backend
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
