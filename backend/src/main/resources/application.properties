# ─── MySQL profile (default) ───────────────────────────────────────────────
spring.application.name=epinet-backend
server.port=8080

# DB settings from env with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epinet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:epinet}
spring.datasource.password=${DB_PASS:epinet_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ML microservice URL (override in env)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Multipart limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Async executor
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
