# docker-compose.yml — EpiNet Visualizer local infrastructure
# WHY: provides MySQL for persistence and Kafka for the async analysis event bus.
# Kafka runs in KRaft mode (no ZooKeeper) to keep the stack simple.

services:
  mysql:
    image: mysql:8.0
    container_name: epinet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-epinet}
      MYSQL_USER: ${MYSQL_USER:-epinet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-epinet_pass}
    ports:
      - "3307:3306"
    command: --max_allowed_packet=256M
    volumes:
      - epinet_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  kafka:
    # WHY KRaft: eliminates ZooKeeper, so one container = one broker.
    # WHY apache/kafka: official Apache Kafka Docker image with KRaft out of the box.
    image: apache/kafka:3.8.0
    container_name: epinet-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # external listener for host-side services
    environment:
      # ── KRaft (no ZooKeeper) ─────────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # ── Listeners ────────────────────────────────────────────────────
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # ── Topics & Partitions ──────────────────────────────────────────
      # WHY 3 partitions default: allows scaling consumers in Phase 4/5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      # WHY: ensures dependent services wait until the broker is accepting connections
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-exporter:
    # WHY danielqsj/kafka-exporter: scrapes Kafka broker consumer group offsets
    # to export consumer lag metrics (kafka_consumergroup_lag) for Prometheus.
    image: danielqsj/kafka-exporter:latest
    container_name: epinet-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    # WHY prom/prometheus: time-series metrics store scraping backend,
    # ML service, kafka-exporter, and itself for Phase 2 observability.
    image: prom/prometheus:latest
    container_name: epinet-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    # WHY grafana/grafana: pre-provisioned visualization dashboard for metrics
    # including request latency, job status gauges, duration, consumer lag, and JVM heap.
    image: grafana/grafana:latest
    container_name: epinet-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  epinet_mysql_data:
